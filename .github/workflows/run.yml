name: Job Circular Bot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate only, do not post to Facebook"
        type: boolean
        default: true

# Only one run at a time. Overlapping runs would both see the same notice as
# "new" and could post it twice.
concurrency:
  group: job-circular-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # The bot lives one level down, in job_circular_bot/
        working-directory: job_circular_bot
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job_circular_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser only if a js_render source is configured
        run: |
          if grep -qE '\|[[:space:]]*js([[:space:]]|$)' company_site_list.txt; then
            echo "A site in company_site_list.txt uses |js, installing Chromium"
            pip install -r requirements-browser.txt
            python -m playwright install --with-deps chromium
          else
            echo "No |js sites configured, skipping the Chromium install"
          fi

      - name: Restore the already-posted database
        uses: actions/cache/restore@v6
        with:
          path: job_circular_bot/data/posted.db
          key: posted-db-${{ github.run_id }}
          restore-keys: |
            posted-db-

      - name: Run the bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_API_VERSION: v26.0
          # Scheduled runs post for real; manual runs default to a safe dry run.
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p data
          python src/main.py --respect-intervals 2>&1 | tee data/run.log

      - name: Save the already-posted database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: job_circular_bot/data/posted.db
          key: posted-db-${{ github.run_id }}

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log-${{ github.run_id }}
          path: job_circular_bot/data/run.log
          if-no-files-found: ignore
