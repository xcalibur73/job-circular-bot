# One entry per company/website you want to monitor.
# Start with 3-5 sources, test them well, then expand toward your full list.
#
# parser: which parsing strategy to use (see src/scraper.py)
#   "static_html"   -> simple requests + BeautifulSoup (fast, works for plain HTML sites)
#   "js_render"     -> Playwright (slower, needed for sites that load content with JavaScript,
#                      e.g. many Workday / Greenhouse / Lever career pages)
#   "rss"           -> the site (or a job board) already publishes an RSS/Atom feed (best case,
#                      no scraping needed at all)
#
# selectors: CSS selectors used to find the notice list and fields on that page.
#   You will need to inspect each site's HTML once (right-click -> Inspect) and fill these in.
#   Every site is different, so this config grows one block at a time.

sources:
  - name: "Example Company Ltd"
    url: "https://example-company.com/careers"
    parser: "static_html"
    selectors:
      list_item: "div.job-listing"       # container for each job/notice
      title: "h3.job-title"
      link: "a.job-link"                 # href = link to the original notice
      date: "span.posted-date"           # optional, used for freshness checks
    link_is_relative: false              # set true if href is like "/jobs/123" not a full URL

  - name: "Example Bank PLC"
    url: "https://example-bank.com/career-notice"
    parser: "js_render"
    selectors:
      list_item: "li.circular-item"
      title: "a.circular-title"
      link: "a.circular-title"
      date: "div.circular-date"
    link_is_relative: true

  - name: "Example Job Board (RSS)"
    url: "https://example-jobboard.com/feed/circulars.xml"
    parser: "rss"
